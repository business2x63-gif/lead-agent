<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redesign Lead Agent</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
          --muted:#8b949e; --accent:#f78166; --green:#3fb950; --red:#f85149; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; padding:32px; }
  .wrap { max-width:1200px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--muted); margin-bottom:24px; }
  .form { display:grid; grid-template-columns:1fr 1fr 110px auto auto;
          gap:10px; background:var(--panel); border:1px solid var(--border);
          border-radius:10px; padding:16px; margin-bottom:14px; }
  input[type=text], input[type=number] {
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:9px 12px; font-size:14px; width:100%; }
  label.check { display:flex; align-items:center; gap:6px; color:var(--muted);
                white-space:nowrap; cursor:pointer; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:9px 20px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:transparent; border:1px solid var(--border);
                 color:var(--text); }
  .status { color:var(--muted); min-height:22px; margin-bottom:14px; }
  .status .err { color:var(--red); }
  .bar { height:4px; background:var(--border); border-radius:2px;
         overflow:hidden; margin-bottom:18px; display:none; }
  .bar div { height:100%; width:40%; background:var(--accent);
             animation:slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }
  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border);
           vertical-align:top; }
  th { background:#1c2128; font-size:12px; text-transform:uppercase;
       letter-spacing:.05em; color:var(--muted); }
  tr:last-child td { border-bottom:0; }
  .score { font-weight:700; font-size:15px; }
  .score.hot { color:var(--red); }
  .score.warm { color:#d29922; }
  .score.cold { color:var(--muted); }
  .chip { display:inline-block; background:#21262d; border:1px solid var(--border);
          border-radius:20px; padding:1px 9px; margin:2px 3px 2px 0;
          font-size:11px; color:var(--text); }
  .chip.bad { border-color:var(--red); color:var(--red); }
  a { color:#58a6ff; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .actions { display:flex; justify-content:space-between; align-items:center;
             margin-bottom:10px; }
  .hidden { display:none; }
  @media (max-width:800px){ .form{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Redesign Lead Agent</h1>
  <p class="sub">Find local businesses with outdated websites — your best
     redesign prospects. Runs 100% on your machine, no API keys.</p>

  <div class="form">
    <input type="text" id="niche" placeholder="Niche, e.g. dentist, plumber, roofer" value="dentist">
    <input type="text" id="city" placeholder="City, e.g. Austin, TX" value="Austin, TX">
    <input type="number" id="max" value="60" min="5" max="150" title="Max results">
    <label class="check"><input type="checkbox" id="missing"> include no-website</label>
    <button id="go">Find Leads</button>
  </div>

  <div class="status" id="status"></div>
  <div class="bar" id="bar"><div></div></div>

  <div class="actions hidden" id="actions">
    <span class="muted" id="summary"></span>
    <button class="ghost" id="csv">⬇ Download CSV</button>
  </div>

  <table class="hidden" id="table">
    <thead><tr>
      <th>Score</th><th>Business</th><th>Phone</th><th>Website</th>
      <th>Outdated signals</th><th>Address</th><th>Rating</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const SIGNAL_LABELS = {
  no_website: "no website at all",
  unreachable: "site down",
  blocked: "blocks bots (check manually)",
  no_https: "no HTTPS",
  no_mobile_viewport: "not mobile-friendly",
  stale_copyright: "stale copyright",
  old_jquery: "old jQuery",
  flash_or_frames: "flash/frames",
  legacy_html: "legacy HTML",
  old_generator: "old CMS version",
  diy_builder: "DIY builder",
  slow_load: "slow load",
  oversized_page: "bloated page",
};
let leads = [];

const $ = id => document.getElementById(id);

$("go").onclick = async () => {
  const niche = $("niche").value.trim(), city = $("city").value.trim();
  if (!niche || !city) { status("Enter a niche and a city.", true); return; }
  $("go").disabled = true; $("bar").style.display = "block";
  $("table").classList.add("hidden"); $("actions").classList.add("hidden");
  status("Scraping businesses, then auditing every website (30–90s)…");
  try {
    const resp = await fetch("/api/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ niche, city, max_results: +$("max").value,
                             include_missing: $("missing").checked }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) { status(data.error || "Request failed.", true); return; }
    leads = data.leads || [];
    render();
    status(`Done — ${data.count} leads (${data.audited} websites audited` +
           (data.no_website ? `, ${data.no_website} without any website` : "") + `).`);
  } catch (e) { status("Network error: " + e.message, true); }
  finally { $("go").disabled = false; $("bar").style.display = "none"; }
};

function render() {
  const rows = $("rows"); rows.innerHTML = "";
  let hot = 0;
  for (const l of leads) {
    const chips = (l.signals || []).map(s =>
      `<span class="chip bad">${SIGNAL_LABELS[s] || s}</span>`).join("");
    const cls = l.score >= 40 ? "hot" : l.score >= 20 ? "warm" : "cold";
    if (l.score >= 40) hot++;
    rows.insertAdjacentHTML("beforeend", `<tr>
      <td><span class="score ${cls}">${l.score ?? 0}</span></td>
      <td><strong>${esc(l.business_name)}</strong><br>
          <span class="muted">${esc(l.categories || "")}</span></td>
      <td>${esc(l.phone || "—")}</td>
      <td>${l.website ? `<a href="${esc(l.website)}" target="_blank">visit</a>` :
          `<span class="chip bad">${SIGNAL_LABELS.no_website}</span>`}</td>
      <td>${chips || `<span class="muted">looks modern</span>`}
          ${l.notes && l.notes.length ? `<br><span class="muted">${esc(l.notes.join("; "))}</span>` : ""}</td>
      <td class="muted">${esc(l.address || "—")}</td>
      <td>${l.rating ? `${l.rating}★ <span class="muted">(${l.reviews || 0})</span>` : "—"}</td>
    </tr>`);
  }
  $("table").classList.remove("hidden");
  $("actions").classList.remove("hidden");
  $("summary").textContent = `${leads.length} leads, ${hot} hot (score ≥ 40), sorted best-first`;
}

$("csv").onclick = () => {
  const head = ["score","business_name","phone","address","website","rating",
                "reviews","outdated_signals","notes","categories"];
  const esc2 = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.join(",")];
  for (const l of leads) {
    lines.push([l.score, l.business_name, l.phone, l.address, l.website,
      l.rating, l.reviews, (l.signals||[]).join(";"), (l.notes||[]).join("; "),
      l.categories].map(esc2).join(","));
  }
  const blob = new Blob([lines.join("\n")], {type: "text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `leads_${$("niche").value.replace(/\W+/g,"_")}_${$("city").value.replace(/\W+/g,"_")}.csv`;
  a.click();
};

function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function status(msg, isErr) {
  $("status").innerHTML = isErr ? `<span class="err">${esc(msg)}</span>` : esc(msg);
}
</script>
</body>
</html>
